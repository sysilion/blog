{{- /* 비밀글 한 편. 캐시된 키가 있으면 묻지 않고 바로 연다. → _partials/secret/vault.html */ -}}
{{- define "main" }}

<article class="post-single">
  <header class="post-header">
    {{ partial "breadcrumbs.html" . }}
    <h1 class="post-title" id="secret-title">🔒 {{ .Title }}</h1>
    {{- if not (.Param "hideMeta") }}
    <div class="post-meta">
      {{- partial "post_meta.html" . -}}
      <button type="button" class="secret-lock" id="secret-lock" hidden>잠그기</button>
    </div>
    {{- end }}
  </header>

  <div id="secret-gate"
       data-iv="{{ .Params.secret_iv }}"
       data-ct="{{ .Params.secret_ct }}"></div>

  <div class="post-content md-content" id="secret-content" hidden></div>
</article>

{{ partial "secret/vault.html" . }}

<script>
(function () {
  var gate = document.getElementById('secret-gate');
  var target = document.getElementById('secret-content');
  var heading = document.getElementById('secret-title');
  var lockBtn = document.getElementById('secret-lock');

  function reveal(key) {
    return SecretVault.open(key, gate.dataset.iv, gate.dataset.ct).then(function (json) {
      var doc = JSON.parse(json);
      target.innerHTML = doc.html;
      target.hidden = false;
      heading.textContent = '🔓 ' + doc.title;
      document.title = doc.title;
      gate.hidden = true;
      if (lockBtn) lockBtn.hidden = false;
      if (location.hash) {
        var anchor = document.querySelector(location.hash);
        if (anchor) anchor.scrollIntoView();
      }
    });
  }

  if (lockBtn) {
    lockBtn.addEventListener('click', function () {
      SecretVault.lock();
      location.reload();
    });
  }

  SecretVault.current().then(function (key) {
    // 키가 있으면 바로. 없거나 이 글에 안 맞으면 물어본다.
    if (key) return reveal(key).catch(function () { SecretVault.lock(); mount(); });
    mount();
  });

  function mount() {
    gate.hidden = false;
    SecretVault.mountGate(gate, reveal);
  }
})();
</script>

{{- end }}{{/* end main */}}
