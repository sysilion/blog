baseURL: "https://bizu.is-a.dev/blog/"
locale: "ko-kr"
defaultContentLanguage: "ko"
title: "Bizu's Blog"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
pygmentsUseClasses: true

pagination:
  pagerSize: 10

minify:
  disableXML: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
  goldmark:
    renderer:
      unsafe: true

params:
  env: production
  mainSections: ["posts"]
  # 커버 이미지가 없는 글에 제목 기반 SVG 커버를 자동으로 붙인다. → layouts/_partials/cover/auto.html
  # 지금은 꺼둠. 글 내용과 무관한 추상 패턴이라 목록에서 자리만 차지했다. true 로 바꾸면 다시 켜진다.
  autoCover: false
  description: "개발 기록과 잡다한 생각들"
  author: "Bizu"
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowToc: true
  TocOpen: false
  ShowRssButtonInSectionTermList: true
  disableScrollToTop: false
  hidemeta: false
  comments: false

  wiki:
    # 빨간 링크의 '만들기' 버튼이 가리킬 곳
    newPageBase: "https://github.com/sysilion/blog/new/main/content/wiki"

  homeInfoParams:
    Title: "안녕하세요 👋"
    Content: >
      개발하면서 남기는 기록, 만든 것들, 그리고 잡다한 생각들.

  socialIcons:
    - name: github
      url: "https://github.com/sysilion"
    - name: rss
      url: "index.xml"

  assets:
    disableHLJS: true
    favicon: "favicon.svg"
    favicon16x16: "favicon.svg"
    favicon32x32: "favicon.svg"
    apple_touch_icon: "favicon.svg"
    safari_pinned_tab: "favicon.svg"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    threshold: 0.4
    minMatchCharLength: 2
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: 글
      url: /posts/
      weight: 10
    - identifier: wiki
      name: 위키
      url: /wiki/
      weight: 15
    - identifier: notes
      name: 노트
      url: /notes/
      weight: 17
    - identifier: secret
      name: 비밀글
      url: /secret/
      weight: 18
    - identifier: tags
      name: 태그
      url: /tags/
      weight: 19
    - identifier: archives
      name: 아카이브
      url: /archives/
      weight: 20
    - identifier: search
      name: 검색
      url: /search/
      weight: 30
    - identifier: home
      name: ← 홈
      url: https://bizu.is-a.dev/
      weight: 40
